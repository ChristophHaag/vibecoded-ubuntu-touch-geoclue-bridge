<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow phablet user to own and provide GeoClue2 service -->
  <policy user="phablet">
    <allow own="org.freedesktop.GeoClue2"/>
    <allow send_destination="org.freedesktop.GeoClue2"/>
    <allow send_interface="org.freedesktop.GeoClue2.Manager"/>
    <allow send_interface="org.freedesktop.GeoClue2.Client"/>
    <allow send_interface="org.freedesktop.GeoClue2.Location"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>

  <!-- Also allow root to own it (for running as system service) -->
  <policy user="root">
    <allow own="org.freedesktop.GeoClue2"/>
    <allow send_destination="org.freedesktop.GeoClue2"/>
  </policy>

  <!-- Allow any user to access the GeoClue2 service (clients like Firefox) -->
  <policy context="default">
    <allow send_destination="org.freedesktop.GeoClue2"/>
    <allow send_interface="org.freedesktop.GeoClue2.Manager"/>
    <allow send_interface="org.freedesktop.GeoClue2.Client"/>
    <allow send_interface="org.freedesktop.GeoClue2.Location"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
